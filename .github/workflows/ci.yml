name: Core CI

# A seconds-scale product smoke for a single-user local tool. It builds once,
# checks the four essential CLI/storage/migration/Driver paths, then verifies
# the package can be assembled and started.

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-repository-dependencies
        with:
          node-version: "24"

      - name: Core path smoke
        run: npm run test:core

      - name: Package structure smoke
        run: |
          node scripts/assemble-runtime-package.mjs --output .release-stage
          npm pack ./.release-stage --dry-run --ignore-scripts --json > package-smoke.json
          node scripts/check-runtime-package-structure.mjs package-smoke.json
          node .release-stage/dist/cli.js help > /dev/null
