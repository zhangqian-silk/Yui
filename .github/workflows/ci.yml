name: Deterministic CI

# The single PR/master deterministic gate (see docs/testing/verification-levels.md).
# It runs once on the exact commit through the hermetic gate runner
# (scripts/gate-hermetic.mjs): install, build, lint, the full deterministic
# suite, and package structure smoke, inside an isolated HOME, XDG tree, git
# identity, temp dir, and npm cache with a sanitized PATH. The runner persists
# a per-SHA gate record (gate-record.json) uploaded as the `gate-record`
# artifact: the per-commit pass/fail evidence. Local development uses
# risk-targeted checks instead of repeating this suite; the release workflow
# reuses its result on the exact tagged commit.
#
# The checkout fetches full history (fetch-depth: 0): on a pull request the
# job passes the base branch as --base-ref, and the runner resolves the exact
# merge base with `git merge-base` and fails closed when it cannot (a shallow
# checkout has no common ancestor, so an empty merge base must never reach a
# record). A red baseline is then classified automatically: the job stays
# green for pre-existing failures and goes red only for failures the change
# introduced. A push to master has no comparable base, so it runs without
# --base-ref and stays fail-closed.

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Hermetic deterministic gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Ensure the base branch ref is available locally, then let the
            # runner resolve the merge base (fail-closed) and classify.
            git fetch origin master
            node scripts/gate-hermetic.mjs --base-ref origin/master --record gate-record.json
          else
            node scripts/gate-hermetic.mjs --record gate-record.json
          fi

      - name: Upload gate record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-record
          path: gate-record.json
          if-no-files-found: error
          retention-days: 90

  bench-slo:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Control-plane SLO benchmark (short mode)
        run: make bench-slo ROUNDS=1 SLO=1

  fault-matrix:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fault-injection regression matrix
        run: make test-tier T=fault-injection
