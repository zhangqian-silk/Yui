name: Deterministic CI

# The single PR/master deterministic gate (see docs/testing/verification-levels.md).
# It runs once on the exact commit through the hermetic gate runner
# (scripts/gate-hermetic.mjs): install, build, lint, the full deterministic
# suite, and package structure smoke, inside an isolated HOME, XDG tree, git
# identity, temp dir, and npm cache with a sanitized PATH. The runner persists
# a per-SHA gate record (gate-record.json) uploaded as the `gate-record`
# artifact: the per-commit pass/fail evidence. Local development uses
# risk-targeted checks instead of repeating this suite; the release workflow
# reuses its result on the exact tagged commit.
#
# Every failing step fails the gate. CI does not re-run an older commit or
# excuse a failure because it also existed in history; master is the green
# baseline and each candidate must satisfy the current contract directly.

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The gate clones this checkout into its hermetic domain. Git
          # rejects a local clone from a shallow repository.
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Hermetic deterministic gate
        run: node scripts/gate-hermetic.mjs --record gate-record.json

      - name: Upload gate record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-record
          path: gate-record.json
          if-no-files-found: error
          retention-days: 90
