name: Core CI

# A seconds-scale product smoke for a single-user local tool. It builds once,
# checks core contracts, then exercises the assembled package's normal path
# with an isolated real Controller/tmux and a deterministic fake Provider.

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-repository-dependencies
        with:
          node-version: "24"

      - name: Core path smoke
        run: npm run test:core

      - name: Install tmux for isolated runtime smoke
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux

      - name: Package structure and normal runtime path
        run: |
          node scripts/assemble-runtime-package.mjs --output .release-stage
          npm pack ./.release-stage --dry-run --ignore-scripts --json > package-smoke.json
          node scripts/check-runtime-package-structure.mjs package-smoke.json
          node scripts/smoke-runtime-package.mjs --assembled .release-stage
