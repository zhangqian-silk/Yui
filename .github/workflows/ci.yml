name: Core CI

# A deliberately small regression tripwire for a single-user product. It builds
# once, runs an explicit list of core storage/workflow/Agent Driver tests, and
# checks the package structure. Broader deterministic, process-lifecycle, and
# real-provider suites remain available on demand but are not merge blockers.

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Core regression smoke
        run: npm run test:core

      - name: Package structure smoke
        run: |
          node scripts/assemble-runtime-package.mjs --output .release-stage
          npm pack ./.release-stage --dry-run --ignore-scripts --json > package-smoke.json
          node scripts/check-runtime-package-structure.mjs package-smoke.json
          node .release-stage/dist/cli.js help > /dev/null
